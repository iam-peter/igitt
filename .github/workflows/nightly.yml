# Every night: build and test on Linux, Windows and macOS and replace the
# nightly release with the new downloads. Nights without new commits are
# skipped, a run by hand builds anyway.
name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  QT_VERSION: "6.11.3"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: check
        name: Anything new since the last nightly?
        run: |
          last=$(git rev-parse -q --verify "refs/tags/nightly^{commit}" || true)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$last" != "$GITHUB_SHA" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing new since $last"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    # The oldest runner, an AppImage runs on systems at least as new
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libfontconfig1 libfuse2

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      # Without KSyntaxHighlighting, which would have to come with the
      # AppImage; the built-in highlighter takes over
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DIGITT_USE_KSYNTAXHIGHLIGHTING=OFF
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: AppImage
        run: |
          base=https://github.com/linuxdeploy
          wget -q $base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q $base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-*.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export QML_SOURCES_PATHS="$GITHUB_WORKSPACE/src/qml"
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib:$LD_LIBRARY_PATH"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --executable build/src/igitt \
            --desktop-file src/logo/igitt.desktop --icon-file src/logo/igitt.svg \
            --plugin qt --output appimage
          mv igitt-*.AppImage igitt-linux-x64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: igitt-linux
          path: igitt-linux-x64.AppImage
          retention-days: 1

  windows:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      # Since 6.11 each Windows toolchain has its own folder in the Qt
      # repository, aqt 3.3.0 doesn't know that yet but its master does
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
          cache: true

      - name: Build
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DIGITT_USE_KSYNTAXHIGHLIGHTING=OFF
          cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory igitt | Out-Null
          Copy-Item build/src/Release/igitt.exe igitt/
          windeployqt --release --qmldir src/qml igitt/igitt.exe
          Compress-Archive -Path igitt -DestinationPath igitt-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: igitt-windows
          path: igitt-windows-x64.zip
          retention-days: 1

  macos:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Build
        run: |
          # Apple silicon and Intel in one app, like the Qt it builds on
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" \
            -DIGITT_USE_KSYNTAXHIGHLIGHTING=OFF
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Disk image
        run: |
          macdeployqt build/src/igitt.app -qmldir="$GITHUB_WORKSPACE/src/qml" -dmg
          mv build/src/igitt.dmg igitt-macos.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: igitt-macos
          path: igitt-macos.dmg
          retention-days: 1

  release:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: igitt-*
          path: artifacts
          merge-multiple: true

      # One rolling pre-release, its tag moves to the commit it was built from
      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly artifacts/* --prerelease --target "$GITHUB_SHA" \
            --title "Nightly $(date -u +%Y-%m-%d)" \
            --notes "Built from $GITHUB_SHA. igitt runs the git command line, git 2.40 or newer has to be installed. The macOS app isn't signed: open it with a right click and Open the first time."
